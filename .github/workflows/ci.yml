name: CI

on:
  push:
    branches: [main, "claude/**", dev]
  pull_request:

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.0
    steps:
      - uses: actions/checkout@v4
      - run: swiftlint lint --reporter github-actions-logging

  core-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Webcams core tests (Linux)
        run: swift test --package-path Examples/FlickDemo/WebcamsKit

  ios:
    name: Build and test (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - run: xcodebuild -version
      - name: Engine tests (macOS)
        run: swift test
      - name: WebcamsKit tests (macOS)
        run: swift test --package-path Examples/FlickDemo/WebcamsKit
      - name: Test on iOS Simulator
        run: |
          # The first available iPhone, whatever simulators this Xcode ships.
          udid=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone[^(]*\([0-9A-F-]{36}\)' | grep -oE '[0-9A-F-]{36}')
          xcodebuild test \
            -scheme flickUI \
            -destination "id=$udid" \
            -skipPackagePluginValidation
      - name: Build demo app for iOS Simulator
        run: |
          xcodebuild build \
            -project Examples/FlickDemo/FlickDemo.xcodeproj \
            -scheme FlickDemo \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
